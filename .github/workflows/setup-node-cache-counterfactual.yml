# A/B counterfactual harness for the `package-manager-cache: false` line in
# ZevaUI's reusable workflow `.github/workflows/audit-ds-usage.yml`.
#
# WHY THIS EXISTS AND WHY IT IS NOT THE `@bf9e59b` TAG.
#
# The obvious way to prove that line is load-bearing would be to point
# `ds-usage.yml` at the revision before it and watch the run go red. That does
# not work: ZevaUI's pre-sweep revision `bf9e59b` — which `v1` still points at
# — pins `actions/setup-node@v4`, and v4 has no implicit package-manager
# caching at all. The bug and its fix arrived in the SAME commit (`17969c7`),
# so no revision of ZevaUI ever published the broken shape, and there is no
# `@<sha>` a consumer can call to reproduce it.
#
# So the broken shape is reconstructed here instead, inside the consumer, where
# it costs ZevaUI nothing. Both jobs below are the audit job's real prologue —
# same consumer checkout at $GITHUB_WORKSPACE, same DS checkout, same Node 22,
# same pinned DS revision, same scanner invocation. The ONLY difference between
# them is one line:
#
#   no-fix    setup-node@v5 with no `package-manager-cache` input  -> expect FAIL
#   with-fix  setup-node@v5 with `package-manager-cache: false`    -> expect PASS
#
# Same runner image, same minute, one variable. `packageManager` in this repo's
# root package.json is what arms it, and there is deliberately no root lockfile
# — that is the second consumer shape the reusable workflow's comment names.
name: setup-node cache counterfactual

# Dispatch only. This harness is evidence, not a gate: it must never run on a
# push, because the `no-fix` job is EXPECTED to be red and a permanently red
# required check teaches people to ignore red.
on:
  workflow_dispatch:

env:
  # Pinned, not `main`: this harness's whole claim is "one line is the
  # difference", which only holds if both jobs scan the identical scanner.
  DS_REF: 17969c7

jobs:
  # THE BUG. Expected to fail on the setup-node step, before the scanner runs.
  no-fix:
    name: no-fix (expected FAIL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: ZevaGuillo/ZevaUI
          ref: ${{ env.DS_REF }}
          path: .zevaui-audit
          persist-credentials: false

      # No `package-manager-cache` input. setup-node@v5 therefore reads
      # $GITHUB_WORKSPACE/package.json — THIS repository's, not ZevaUI's —
      # finds `packageManager: pnpm@...`, and tries to resolve a pnpm store in
      # a job that installs no pnpm.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Not expected to be reached. Present so that a failure anywhere else
      # cannot be mistaken for a failure at setup-node.
      - name: Audit design-system usage
        env:
          AUDIT_APP: counterfactual-no-fix
          AUDIT_WORKING_DIRECTORY: "."
        run: node .zevaui-audit/packages/audit/scripts/audit-usage.js > ds-usage-report.json

  # THE CONTROL. Byte-identical to the job above except for the one input.
  with-fix:
    name: with-fix (expected PASS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: ZevaGuillo/ZevaUI
          ref: ${{ env.DS_REF }}
          path: .zevaui-audit
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Audit design-system usage
        env:
          AUDIT_APP: counterfactual-with-fix
          AUDIT_WORKING_DIRECTORY: "."
        run: node .zevaui-audit/packages/audit/scripts/audit-usage.js > ds-usage-report.json

      - name: Show the report this job actually produced
        run: cat ds-usage-report.json
